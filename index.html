<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Precio de Venta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #1f4037, #99f2c8); /* Fondo más ejecutivo y alegre */
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    input {
      background-color: #ffffff;
      border: 1px solid #ccc;
      color: #333;
    }
    .form-label {
      font-weight: bold;
    }
    .resultado {
      font-size: 1.5rem;
      margin-top: 1rem;
    }
    .comic-img {
      max-width: 100%;
      height: auto;
      border-radius: 1rem;
      margin-top: 2rem;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }
    table {
      margin-top: 2rem;
    }
    th, td {
      color: white;
    }
    .btn-eliminar {
      color: red;
      cursor: pointer;
    }
    .btn-impactante {
      background: linear-gradient(45deg, #ff6a00, #ee0979);
      border: none;
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(238, 9, 121, 0.4);
      transition: all 0.3s ease-in-out;
    }
    .btn-impactante:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 106, 0, 0.6);
    }
    .table-dark {
      background-color: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="container animate__animated animate__fadeIn">
    <h1 class="mb-4">🦸 Calculadora de Precio de Venta</h1>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <label for="concepto" class="form-label">Nombre del producto 🏷️</label>
        <input type="text" class="form-control mb-3" id="concepto" placeholder="Ej: Camiseta Avengers">

        <label for="costo" class="form-label">Costo base del producto 💰</label>
        <input type="number" class="form-control mb-3" id="costo" placeholder="Ej: 100">

        <label for="ganancia" class="form-label">Porcentaje de ganancia deseado (%) 📈</label>
        <input type="number" class="form-control mb-3" id="ganancia" placeholder="Ej: 30">

        <button class="btn btn-impactante w-100" onclick="calcularPrecio()">Calcular Precio Final 🚀</button>

        <div id="resultado" class="resultado animate__animated"></div>

        <button class="btn btn-success mt-3 w-100" onclick="exportarExcel()">📥 Exportar a Excel</button>
      </div>
    </div>

    <input type="text" id="busqueda" class="form-control mt-4" placeholder="🔍 Buscar producto" onkeyup="filtrarTabla()">

    <table class="table table-dark table-bordered" id="tablaProductos">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Costo</th>
          <th>Ganancia (%)</th>
          <th>Precio Final</th>
          <th>Margen</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <img src="https://upload.wikimedia.org/wikipedia/en/1/17/Avengers_Assemble_vol_2_1_Textless.jpg" alt="Avengers Comic" class="comic-img animate__animated animate__zoomIn">
  </div>

  <audio id="sonidoCaja" src="https://www.myinstants.com/media/sounds/cash-register.mp3"></audio>

  <script>
    const STORAGE_KEY = "productosGuardados";

    function calcularPrecio() {
      const concepto = document.getElementById("concepto").value.trim();
      const costo = parseFloat(document.getElementById("costo").value);
      const ganancia = parseFloat(document.getElementById("ganancia").value);
      const resultadoDiv = document.getElementById("resultado");
      const sonidoCaja = document.getElementById("sonidoCaja");
      const tabla = document.getElementById("tablaProductos").querySelector("tbody");

      if (!concepto || isNaN(costo) || isNaN(ganancia)) {
        resultadoDiv.className = "resultado text-danger animate__animated animate__shakeX";
        resultadoDiv.innerHTML = "❌ Por favor, ingresa todos los campos correctamente.";
        return;
      }

      for (let fila of tabla.rows) {
        if (fila.cells[0].textContent.toLowerCase() === concepto.toLowerCase()) {
          resultadoDiv.className = "resultado text-warning animate__animated animate__headShake";
          resultadoDiv.innerHTML = `⚠️ El producto "${concepto}" ya fue ingresado.`;
          return;
        }
      }

      const precioFinal = costo * (1 + ganancia / 100);
      const margenGanancia = precioFinal - costo;

      resultadoDiv.className = "resultado text-success animate__animated animate__fadeInUp";
      resultadoDiv.innerHTML = `
        ✅ Precio sugerido: <strong>$${precioFinal.toFixed(2)}</strong><br>
        💵 Ganancia estimada: <strong>$${margenGanancia.toFixed(2)}</strong>
      `;

      const fila = tabla.insertRow();
      fila.innerHTML = `
        <td>${concepto}</td>
        <td>$${costo.toFixed(2)}</td>
        <td>${ganancia}%</td>
        <td>$${precioFinal.toFixed(2)}</td>
        <td>$${margenGanancia.toFixed(2)}</td>
        <td><span class="btn-eliminar" onclick="eliminarFila(this)">🗑️</span></td>
      `;

      sonidoCaja.play();

      guardarProducto({ concepto, costo, ganancia, precioFinal, margenGanancia });
    }

    function eliminarFila(elemento) {
      const fila = elemento.closest("tr");
      const concepto = fila.cells[0].textContent;
      fila.remove();
      eliminarProducto(concepto);
    }

    function exportarExcel() {
      const tabla = document.getElementById("tablaProductos");
      const wb = XLSX.utils.table_to_book(tabla, {sheet: "Productos"});
      XLSX.writeFile(wb, "productos_calculados.xlsx");
    }

    function filtrarTabla() {
      const input = document.getElementById("busqueda").value.toLowerCase();
      const filas = document.getElementById("tablaProductos").getElementsByTagName("tbody")[0].getElementsByTagName("tr");

      for (let fila of filas) {
        const texto = fila.cells[0].textContent.toLowerCase();
        fila.style.display = texto.includes(input) ? "" : "none";
      }
    }

    function guardarProducto(producto) {
      let productos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      productos.push(producto);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(productos));
    }

    function eliminarProducto(nombre) {
      let productos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      productos = productos.filter(p => p.concepto !== nombre);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(productos));
    }

    function cargarProductos() {
      let productos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      const tabla = document.getElementById("tablaProductos").querySelector("tbody");
      productos.forEach(p => {
        const fila = tabla.insertRow();
        fila.innerHTML = `
          <td>${p.concepto}</td>
          <td>$${p.costo.toFixed(2)}</td>
          <td>${p.ganancia}%</td>
          <td>$${p.precioFinal.toFixed(2)}</td>
          <td>$${p.margenGanancia.toFixed(2)}</td>
          <td><span class="btn-eliminar" onclick="eliminarFila(this)">🗑️</span></td>
        `;
      });
    }

    window.onload = cargarProductos;
  </script>
</body>
</html>
